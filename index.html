<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-inner">
            <span class="logo">🎬 MovieHub</span>
            <span class="nav-tagline">Discover films in seconds</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-inner">
            <h1>Movie Hub</h1>
            <p class="tagline">Search any movie — posters, ratings, cast &amp; full plot, all in one place.</p>

            <form id="movieForm" action="">
                <input id="movieInput" type="text" placeholder="Search movie title (e.g. Inception, The Matrix)...">
                <button>Search</button>
            </form>

            <ul class="features">
                <li>⚡ Instant search</li>
                <li>🎭 Full cast &amp; plot</li>
                <li>⭐ IMDb ratings</li>
            </ul>
        </div>
    </header>

    <main id="movieHub"></main>

    <footer>
        <p>© 2026 Movie Hub. All rights reserved.</p>
    </footer>

    <script src="Movie hub project.js"></script>
</body>

</html>
